site_name: MoLAG
site_description: Monocular LED assignment with a graph neural network
site_url: https://yannikheizmann.github.io/MoLAG/
repo_url: https://github.com/yannikheizmann/MoLAG
repo_name: yannikheizmann/MoLAG
copyright: Copyright &copy; 2026 Yannik Heizmann and Harald Hoppe

theme:
  name: material
  logo: assets/tracker_configuration.svg
  favicon: assets/tracker_configuration.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Method:
      - Overview: method/index.md
      - Synthetic data: method/synthetic-data.md
      - Model and loss: method/model-and-loss.md
      - Inference: method/inference.md
  - Guides:
      - Installation: guides/installation.md
      - Reproduce the workflow: guides/reproduction.md
      - Calibrated inference: guides/calibrated-inference.md
  - Extending MoLAG: extending.md
  - Configuration: configuration.md
  - Output artifacts: artifacts.md
  - API reference: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            filters:
              - "!^_"
            heading_level: 2
            members_order: source
            show_root_heading: true
            show_source: false
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yannikheizmann/MoLAG
      name: MoLAG on GitHub
