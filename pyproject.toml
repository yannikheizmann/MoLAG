[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "molag"
version = "0.1.0.dev0"
description = "Monocular LED assignment with a graph neural network"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Yannik Heizmann", email = "yheizman@stud.hs-offenburg.de" },
]
keywords = [
    "graph-neural-network",
    "medical-navigation",
    "optical-tracking",
    "pytorch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "accelerate>=0.26",
    "huggingface-hub>=0.34",
    "numpy>=2.0",
    "pydantic>=2.12",
    "pyyaml>=6.0",
    "safetensors>=0.6",
    "torch==2.9.1",
    "torch-geometric==2.7.0",
    "transformers>=4.57.1,<5",
    "wandb>=0.23",
]

[project.urls]
Repository = "https://github.com/yannikheizmann/MoLAG"

[project.scripts]
evaluate = "molag.main:Main.evaluate"
finetune = "molag.main:Main.finetune"
generate_eval_dataset = "molag.main:Main.generate_eval_dataset"
recompute = "molag.main:Main.recompute"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.12",
]

[tool.hatch.build]
exclude = [
    "/INSTRUCTIONS.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/molag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
