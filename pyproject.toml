[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "molag"
version = "0.1.0.dev0"
description = "Monocular LED assignment with a graph neural network"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/molag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

